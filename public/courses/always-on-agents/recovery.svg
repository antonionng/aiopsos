<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc"><title id="title">Checking what happened before trying again</title><desc id="desc">Pause: Stop before repeating an uncertain action; Check what happened: Look for the expected saved result; Try again or ask for help: Ask the owner if the result is uncertain</desc><rect width="1100" height="340" rx="24" fill="#f5f2fb"/><g font-family="Arial, sans-serif"><text x="34" y="43" fill="#735b9c" font-size="12" font-weight="700" letter-spacing="2">EXPERRT / AGENT FOUNDATIONS</text><text x="34" y="87" fill="#252035" font-size="27" font-weight="700">Checking what happened before trying again</text><rect x="34" y="125" width="320" height="174" rx="20" fill="white" stroke="#dedbe8"/><circle cx="70" cy="164" r="18" fill="#ece7fc"/><text x="70" y="171" text-anchor="middle" fill="#4c328d" font-size="18" font-weight="700">1</text><text x="58" y="211" fill="#252035" font-size="18" font-weight="700">Pause</text><text x="58" y="250" fill="#655e73" font-size="14">Stop before repeating an uncertain action</text><path d="M 363 210 h 20 m -7 -7 7 7 -7 7" fill="none" stroke="#8066b7" stroke-width="3"/><rect x="394" y="125" width="320" height="174" rx="20" fill="white" stroke="#dedbe8"/><circle cx="430" cy="164" r="18" fill="#ece7fc"/><text x="430" y="171" text-anchor="middle" fill="#4c328d" font-size="18" font-weight="700">2</text><text x="418" y="211" fill="#252035" font-size="18" font-weight="700">Check what happened</text><text x="418" y="250" fill="#655e73" font-size="14">Look for the expected saved result</text><path d="M 723 210 h 20 m -7 -7 7 7 -7 7" fill="none" stroke="#8066b7" stroke-width="3"/><rect x="754" y="125" width="320" height="174" rx="20" fill="white" stroke="#dedbe8"/><circle cx="790" cy="164" r="18" fill="#ece7fc"/><text x="790" y="171" text-anchor="middle" fill="#4c328d" font-size="18" font-weight="700">3</text><text x="778" y="211" fill="#252035" font-size="18" font-weight="700">Try again or ask for help</text><text x="778" y="250" fill="#655e73" font-size="14">Ask the owner if the result is uncertain</text></g></svg>