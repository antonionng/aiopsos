<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc"><title id="title">Checking a report against its original records</title><desc id="desc">Read the original records: Use the agreed source and reporting date; Check the report’s statements: Compare each conclusion with its record; Correct and review the report: Fix mistakes before sharing</desc><rect width="1100" height="340" rx="24" fill="#f5f2fb"/><g font-family="Arial, sans-serif"><text x="34" y="43" fill="#735b9c" font-size="12" font-weight="700" letter-spacing="2">EXPERRT / AGENT FOUNDATIONS</text><text x="34" y="87" fill="#252035" font-size="27" font-weight="700">Checking a report against its original records</text><rect x="34" y="125" width="320" height="174" rx="20" fill="white" stroke="#dedbe8"/><circle cx="70" cy="164" r="18" fill="#ece7fc"/><text x="70" y="171" text-anchor="middle" fill="#4c328d" font-size="18" font-weight="700">1</text><text x="58" y="211" fill="#252035" font-size="18" font-weight="700">Read the original records</text><text x="58" y="250" fill="#655e73" font-size="14">Use the agreed source and reporting date</text><path d="M 363 210 h 20 m -7 -7 7 7 -7 7" fill="none" stroke="#8066b7" stroke-width="3"/><rect x="394" y="125" width="320" height="174" rx="20" fill="white" stroke="#dedbe8"/><circle cx="430" cy="164" r="18" fill="#ece7fc"/><text x="430" y="171" text-anchor="middle" fill="#4c328d" font-size="18" font-weight="700">2</text><text x="418" y="211" fill="#252035" font-size="18" font-weight="700">Check the report’s statements</text><text x="418" y="250" fill="#655e73" font-size="14">Compare each conclusion with its record</text><path d="M 723 210 h 20 m -7 -7 7 7 -7 7" fill="none" stroke="#8066b7" stroke-width="3"/><rect x="754" y="125" width="320" height="174" rx="20" fill="white" stroke="#dedbe8"/><circle cx="790" cy="164" r="18" fill="#ece7fc"/><text x="790" y="171" text-anchor="middle" fill="#4c328d" font-size="18" font-weight="700">3</text><text x="778" y="211" fill="#252035" font-size="18" font-weight="700">Correct and review the report</text><text x="778" y="250" fill="#655e73" font-size="14">Fix mistakes before sharing</text></g></svg>